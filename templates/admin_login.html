
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - SmartStay AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="admin-page">

    <main class="login-card">

        <a class="brand" href="/">
            SmartStay <span>AI</span>
        </a>

        <h1>Admin Login</h1>

        <p>
            Welcome to SmartStay AI Admin Panel.
            Enter your password to continue.
        </p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <label for="password">
                Admin Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button class="primary-button" type="submit">
                Login
            </button>

        </form>

        <a href="/">← Back to Home</a>

    </main>

</body>
</html>
